# Serves the built Studio SPA and reverse-proxies backend calls same-origin, so the
# browser never needs an absolute backend URL (works on localhost or any LAN host).
# The service name `studio-backend` resolves on the Compose network.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # BFF API and Spring actuator → Studio backend.
    location /api/ {
        proxy_pass http://studio-backend:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /actuator/ {
        proxy_pass http://studio-backend:8090;
        proxy_set_header Host $host;
    }

    # SPA fallback (Studio uses HashRouter, but this keeps deep links safe).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
